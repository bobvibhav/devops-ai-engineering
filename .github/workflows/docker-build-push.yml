name: Build and Push to ECR

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        run: aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 302524629626.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build image
        run: docker build -t vibhav-app:${{ github.sha }} -f docker/Dockerfile.vol docker/

      - name: Tag and push
        run: |
          docker tag vibhav-app:${{ github.sha }} 302524629626.dkr.ecr.ap-south-1.amazonaws.com/vibhav-app:${{ github.sha }}
          docker push 302524629626.dkr.ecr.ap-south-1.amazonaws.com/vibhav-app:${{ github.sha }}