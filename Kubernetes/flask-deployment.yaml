apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibhav-flask-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vibhav-flask
  template:
    metadata:
      labels:
        app: vibhav-flask
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: vibhav-flask
          image: 302524629626.dkr.ecr.ap-south-1.amazonaws.com/vibhav-flask:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: vibhav-flask-service
spec:
  type: ClusterIP
  selector:
    app: vibhav-flask
  ports:
    - port: 80
      targetPort: 5000